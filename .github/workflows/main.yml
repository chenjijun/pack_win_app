name: Build Windows Executable (Manual Trigger)

# 仅在手动触发时运行（移除了 push 触发）
on:
  workflow_dispatch:  # 这是关键：只允许手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path -Path "requirement.txt") {
            pip install -r requirement.txt
          } else {
            Write-Host "No requirement.txt found."
          }

      - name: Install PyInstaller
        run: pip install pyinstaller

      # 单行打包命令（无换行，无 ^ 或 `）
      - name: Build executable with PyInstaller
        run: pyinstaller --onefile --windowed --hidden-import=encodings --hidden-import=codecs --name=api_test api_test.py

      - name: Upload executable as artifact
        uses: actions/upload-artifact@v4
        with:
          name: api_test-windows-x64
          path: dist/api_test.exe
          retention-days: 7
