name: Build Windows Executable (Manual Trigger)

# 仅允许手动触发（不会因 push 自动运行）
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path -Path "requirement.txt") {
            pip install -r requirement.txt
          } else {
            Write-Host "No requirement.txt found."
          }

      - name: Install PyInstaller
        run: pip install pyinstaller

      # 关键修复：使用 --collect-all 确保 encodings 完整包含
      - name: Build executable with PyInstaller
        run: pyinstaller --onefile --windowed --collect-all encodings --collect-all codecs --name=api_test api_test.py

      - name: Upload executable as artifact
        uses: actions/upload-artifact@v4
        with:
          name: api_test-windows-x64
          path: dist/api_test.exe
          retention-days: 7
